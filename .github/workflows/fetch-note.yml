name: Fetch Note Articles

on:
  schedule:
    - cron: '0 0 * * 3'   # 毎週水曜日 午前9時（JST）に実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Note RSS and generate JSON
        run: |
          node - << 'JSEOF'
          const fs = require('fs');

          function extractTag(item, tag) {
            const cdata = item.match(new RegExp(`<${tag}><!\\[CDATA\\[([\\s\\S]*?)\\]\\]><\\/${tag}>`));
            if (cdata) return cdata[1];
            const normal = item.match(new RegExp(`<${tag}>([\\s\\S]*?)<\\/${tag}>`));
            return normal ? normal[1].trim() : '';
          }

          function extractThumbnail(item, description) {
            const media = item.match(/<media:thumbnail[^>]+url="([^"]+)"/);
            if (media) return media[1];
            const enclosure = item.match(/<enclosure[^>]+url="([^"]+)"/);
            if (enclosure) return enclosure[1];
            const img = description.match(/<img[^>]+src="([^"]+)"/);
            if (img) return img[1];
            return '';
          }

          async function main() {
            const rssUrl = 'https://note.com/business_lab_jp/rss';
            const res = await fetch(rssUrl, {
              headers: { 'User-Agent': 'Mozilla/5.0' }
            });
            const xml = await res.text();

            const items = [...xml.matchAll(/<item>([\s\S]*?)<\/item>/g)]
              .slice(0, 3)
              .map(match => {
                const item = match[1];
                const title       = extractTag(item, 'title');
                const link        = extractTag(item, 'link');
                const pubDate     = extractTag(item, 'pubDate');
                const description = extractTag(item, 'description');
                const thumbnail   = extractThumbnail(item, description);
                console.log(`  ${title} | thumb: ${thumbnail.slice(0, 60) || 'none'}`);
                return { title, link, pubDate, thumbnail };
              });

            fs.writeFileSync('note-articles.json', JSON.stringify(items, null, 2));
            console.log(`Saved ${items.length} articles`);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add note-articles.json
          git diff --staged --quiet || git commit -m "chore: update note articles"
          git push
