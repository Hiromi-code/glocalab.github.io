name: Fetch Note Articles

on:
  schedule:
    - cron: '0 0 * * 3'   # 毎週水曜日 午前9時（JST）に実行
  workflow_dispatch:        # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Note RSS and generate JSON
        run: |
          python3 - << 'PYEOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re

          NOTE_ID = 'business_lab_jp'
          rss_url = f'https://note.com/{NOTE_ID}/rss'

          req = urllib.request.Request(rss_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=15) as r:
              xml_bytes = r.read()

          # 名前空間を登録
          ns = {
              'media': 'http://search.yahoo.com/mrss/',
              'dc':    'http://purl.org/dc/elements/1.1/',
          }

          root = ET.fromstring(xml_bytes)
          items = root.findall('.//item')[:3]

          articles = []
          for item in items:
              title = item.findtext('title') or ''
              pub   = item.findtext('pubDate') or ''

              # linkはテキストノードではなくtailに入ることがあるため正規表現で取得
              raw = ET.tostring(item, encoding='unicode')
              link_m = re.search(r'<link>(.*?)</link>', raw)
              if not link_m:
                  # <link/>の直後のテキスト（CDATA形式）
                  link_m = re.search(r'<link/?>([^<]+)', raw)
              link = link_m.group(1).strip() if link_m else ''

              # media:thumbnail（属性url）
              thumb_m = re.search(r'<media:thumbnail[^>]+url=["\']([^"\']+)["\']', raw)
              thumb = thumb_m.group(1) if thumb_m else ''

              # fallback: description内のimgタグ
              if not thumb:
                  desc_m = re.search(r'<description>(.*?)</description>', raw, re.DOTALL)
                  if desc_m:
                      img_m = re.search(r'<img[^>]+src=["\']([^"\']+)["\']', desc_m.group(1))
                      if img_m:
                          thumb = img_m.group(1)

              articles.append({'title': title, 'link': link, 'pubDate': pub, 'thumbnail': thumb})

          with open('note-articles.json', 'w', encoding='utf-8') as f:
              json.dump(articles, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(articles)} articles')
          for a in articles:
              print(f"  {a['title']} | thumb: {a['thumbnail'][:60] if a['thumbnail'] else 'none'}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add note-articles.json
          git diff --staged --quiet || git commit -m "chore: update note articles"
          git push
