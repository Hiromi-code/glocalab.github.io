<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="cat">
      <circle cx="16" cy="20" r="11"/>
      <polygon points="6,13 10,4 15,13"/>
      <polygon points="17,13 22,4 26,13"/>
    </clipPath>
  </defs>

  <!-- 背景: 黒の角丸正方形 -->
  <rect width="32" height="32" rx="7" fill="#0d0d0d"/>

  <!-- 猫シルエット内のコンテンツ -->
  <g clip-path="url(#cat)">
    <!-- ベース: クリーム色 -->
    <rect width="32" height="32" fill="#f0ede5"/>
    <!-- 左上: オレンジ -->
    <rect x="0" y="0" width="16" height="19" fill="#E07B21"/>
    <!-- 右上: ティール -->
    <rect x="16" y="0" width="16" height="19" fill="#2C7D7B"/>
    <!-- 右下: オレンジパッチ -->
    <rect x="18" y="22" width="14" height="10" fill="#E07B21"/>

    <!-- パズル縦線 (右にタブ y=9〜13) -->
    <path d="M16,4 L16,9 A2,2,0,0,1,16,13 L16,31"
          fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- パズル横線 (上にタブ x=18〜22) -->
    <path d="M5,19 L18,19 A2,2,0,0,0,22,19 L29,19"
          fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
